<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profil</title>
    <link rel="icon" type="image/png" href="./assets/images/question.svg">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.3/jquery.min.js" integrity="sha512-STof4xm1wgkfm7heWqFJVn58Hm3EtS31XFaagaa8VMReCXAkQnJZ+jEy8PCC/iT18dFy95WcExNHFTqLyp72eQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="profil.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <!--En-tête avec gradient linéaire de couleur-->
    <header class="mb-4 gradient-custom rounded d-flex align-items-center justify-content-center" style="height: 100px;">
        <h1 class="p-0 m-0">Profil</h1>
    </header>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 ">
                <!--Barre de navigation-->
                <nav class="navbar navbar-expand-lg mb-4">
                    <div class="container-fluid px-0">                        
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                            <div class="navbar-nav gap-2 mt-2 mt-lg-0">
                                <a class="btn btn-nav rounded-5 btn-outline-dark mx-2" href="index.html">Accueil</a>
                                <a class="btn btn-nav rounded-5 btn-outline-dark mx-2" href="inscription.html">S'inscrire</a>
                                <a class="btn btn-nav rounded-5 btn-outline-dark mx-2" href="connexion.html">Se connecter</a>
                                <a class="btn btn-nav rounded-5 btn-outline-dark mx-2 active" aria-current="page" href="profil.html">Profil</a>
                                <a class="btn btn-nav rounded-5 btn-outline-dark mx-2" href="jouer.html">Jouer</a>
                            </div>
                        </div>
                    </div>
                </nav>
                <!--Formulaire-->  
                <fieldset class="bg-white border rounded-3 shadow-sm p-2 p-md-4">
                    <legend id="welcomeMessage" class="h2 text-center mb-3"></legend>    
                    <form action="" method="POST">
                        <img id="avatar" style="height:75px;" class="rounded mb-3 d-block mx-auto" src="./assets/images/question.svg">       
                        <div class="mb-3"> 
                            <label for="userName" class="form-label fs-5">Nom d'utilisateur</label>
                            <input id="userName" 
                            name ="userName" 
                            class="form-control border-0 px-0"
                            type="text"
                            readonly>
                            <hr>
                        </div>                          
                        <div class="mb-3">
                            <label for="email" class="form-label fs-5">Email</label>
                            <input id="email" 
                            name ="email" 
                            class="form-control border-0 px-0"
                            type="text"
                            readonly>
                            <hr>
                        </div>       
                        <div class="mb-4">         
                            <label for="choixMemory" class="form-label fs-5">Choix du memory</label>
                            <select class="form-select mb-3" name="choixMemory" id="choixMemory">
                                <option value="Légumes" selected>Légumes</option>
                                <option value="Animaux">Animaux</option>
                                <option value="Animaux animés">Animaux animés</option>
                                <option value="Animaux Domestiques">Animaux Domestiques</option>
                                <option value="Chiens">Chiens</option>
                                <option value="Dinosaures">Dinosaures</option>
                                <option value="Dinosaures avec nom">Dinosaures avec noms</option>
                                <option value="Lettres Scrablle">Lettres Scrabble</option>
                            </select>                                
                        </div>
                        <img id="imageMemory" src="./assets/images/memory-legume/memory_detail.png" alt="illustration du memory sélectionné" class="mb-3 d-block mx-auto img" style=" max-height : 200px">
                        <div class="mb-3">
                            <label for="choixTaille" class="form-label fs-5">Choix de la taille de la grille</label>
                            <select class="form-select mb-3" name="choixTaille" id="choixTaille">
                                <option value="4*3" selected>4x3</option>
                                <option value="4*4">4x4</option>
                                <option value="5*4">5x4</option>
                                <option value="5*6">5x6</option>            
                            </select>
                        </div>
                        <button type="submit" id="saveOptions" class="btn btn-form">Enregistrez les options</button>
                    </form>
                </fieldset>
            </div>
        </div>
    </main>
<!--Bootstrap pour fonctionnement du menu mobile-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
</body>
</html>
